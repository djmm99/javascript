<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tarefas</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>
    <div id="task-container">
        <div id="task-header">
            <h2>Salve a sua proxima tarefa:</h2>
            <form action="" id="add-task-form">
                <input type="text" name="" id="task-title" placeholder="O que você vai fazer?">
                <button id="add-btn" type="submit">
                    <span class="material-symbols-outlined">add</span>
                </button>
            </form>
        </div>
    </div>
    
    <div id="tasks-list-container">
        <h2>Estas são as suas tarefas:</h2>
        <ul id="task-list">
            <li id="task-box">
                <span class="task-title">Teste 1</span>
                <span class="done-btn material-symbols-outlined">check</span>
                <span class="remove-btn material-symbols-outlined">delete</span>
            </li>

            <li id="task-box">
                <span class="task-title">Teste 2</span>
                <span class="done-btn material-symbols-outlined">check</span>
                <span class="remove-btn material-symbols-outlined">delete</span>
            </li>

            <li id="task-box">
                <span class="task-title">Teste 3</span>
                <span class="done-btn material-symbols-outlined">check</span>
                <span class="remove-btn material-symbols-outlined">delete</span>
            </li>

        </ul>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
